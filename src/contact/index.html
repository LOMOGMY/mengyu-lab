<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="联系我 · 葛孟雨" />
  <meta property="og:description" content="邮箱、电话与在线留言。" />
  <meta property="og:image" content="/assets/images/avatar.jpg" />
  <meta property="og:locale" content="zh_CN" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/favicon-180.png" />
  <link rel="manifest" href="/manifest.json" />

  <link rel="stylesheet" href="../styles/main.css" />
  <link rel="stylesheet" href="../styles/page.css" />
  <link rel="stylesheet" href="../styles/contact.css" />

  <!-- Cloudflare Turnstile 反机器人验证 -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad" async defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a href="../index.html" class="brand">
        <span class="brand-mark" aria-hidden="true" style="background-image:url('/assets/images/avatar-200.jpg')"></span>
        葛孟雨<span class="brand-en">· Ge Mengyu</span>
      </a>
      <nav class="nav-links" aria-label="主导航">
        <a href="../index.html#about">关于</a>
        <a href="../index.html#experience">经历</a>
        <a href="../projects/index.html">项目</a>
        <a href="../index.html#publications">论文</a>
        <a href="../blog/index.html">随笔</a>
        <a href="index.html" class="active">联系</a>
      </nav>
    </div>
  </header>

  <main class="page-contact">
    <div class="container">
      <a class="back-link" href="../index.html">← 返回首页</a>

      <header class="page-header">
        <h1>联系我</h1>
        <p class="muted">技术交流 · 合作邀请 · 任何想说的话</p>
      </header>

      <div class="contact-grid">
        <!-- 表单卡片 -->
        <article class="card">
          <h3>在线留言</h3>
          <form id="contact-form" class="contact-form" novalidate>
            <div class="field">
              <label for="name">姓名</label>
              <input id="name" name="name" type="text" required maxlength="50" placeholder="你的名字" />
            </div>
            <div class="field">
              <label for="email">邮箱</label>
              <input id="email" name="email" type="email" required maxlength="100" placeholder="you@example.com" />
            </div>
            <div class="field">
              <label for="message">留言内容</label>
              <textarea id="message" name="message" required rows="5" maxlength="1000" placeholder="想说点什么…"></textarea>
            </div>
            <!-- Cloudflare Turnstile 验证组件（Managed 模式：通常用户无感知） -->
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAEc6Kdvim1mYRRW8" data-callback="onTurnstileSuccess"></div>
            <p id="turnstile-hint" class="muted turnstile-hint">正在加载人机验证…</p>
            <button type="submit" class="btn btn-primary" id="submit-btn" disabled>提交留言</button>
            <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
          </form>
        </article>

        <!-- 联系方式卡片 -->
        <article class="card">
          <h3>直接联系</h3>
          <ul class="bullets">
            <li><strong>邮箱：</strong><a href="mailto:lomo123456@foxmail.com">lomo123456@foxmail.com</a></li>
            <li><strong>电话：</strong><a href="tel:+8613066825961">+86 13066825961</a></li>
            <li><strong>所在城市：</strong>深圳</li>
          </ul>
          <h3 class="mt">回复时间</h3>
          <p class="muted">
            工作日通常 24 小时内回复。如有紧急事务，建议直接邮件标题加上 <code>[紧急]</code> 前缀。
          </p>
        </article>
      </div>

      <!-- 留言列表 -->
      <section class="card messages-section">
        <h3>最近的留言 <span class="muted" id="messages-count"></span></h3>
        <div id="messages-list" class="messages-list">
          <p class="muted">加载中…</p>
        </div>
        <button id="reload-messages" class="btn btn-ghost" type="button">刷新留言</button>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© 2026 葛孟雨 · Ge Mengyu</span>
      <span><a href="index.html">联系方式</a></span>
    </div>
  </footer>

  <script src="../scripts/contact.js"></script>
</body>
</html>
