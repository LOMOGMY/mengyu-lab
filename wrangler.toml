# wrangler.toml
# Cloudflare Pages 的配置文件。
#
# 当仓库根目录有 wrangler.toml 时，Cloudflare Pages 会用它来管理
# 所有 bindings（KV、D1、R2、AI 等）。控制台的绑定 UI 会被禁用，
# 显示「此项目的绑定在通过 wrangler.toml 进行管理」。
#
# 因此：所有绑定都必须写在这里，不能再去控制台点。

name = "mengyu-lab"
compatibility_date = "2024-09-23"
pages_build_output_dir = "./src"

# ---------- D1 数据库绑定 ----------
# database_id 在 Cloudflare Dashboard -> Workers & Pages -> D1 ->
# 点击对应数据库 -> Database ID 字段。
[[d1_databases]]
binding = "DB"
database_name = "mengyu-lab-messages"
database_id = "23e80796-c308-4fdb-9514-e6bd052234db"

# ---------- 未来要加的 binding ----------
# 比如：
#
# KV 命名空间：
# [[kv_namespaces]]
# binding = "MY_KV"
# id = "<kv-namespace-id>"
#
# 环境变量（Secrets）：
# [vars]
# MY_PUBLIC_VAR = "hello"
#
# [env.production.vars]
# MY_SECRET = "xxx"  # 注意：Secrets 应通过 `wrangler secret put` 设置，
#                     #      不要直接写在这里。