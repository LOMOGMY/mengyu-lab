# wrangler.toml
# Cloudflare Workers / Pages 的配置文件。
# 我们用它来配置本地开发时与 D1 的绑定。
#
# 生产环境（线上）的 D1 绑定，是在 Cloudflare 控制台手动做的，
# 不需要在这里写 database_id —— Cloudflare 会通过 dashboard 注入。

name = "mengyu-lab"
compatibility_date = "2024-09-23"
pages_build_output_dir = "./src"

# 本地开发用的 D1 绑定：
# 运行 `wrangler pages dev` 时，会自动使用 miniflare 在本地跑一个 SQLite。
# 这个 database_id 在你执行 `wrangler d1 create mengyu-lab-messages` 后得到。
# 先注释掉，等你在控制台创建完 D1，把 id 填进来再启用：
#
# [[d1_databases]]
# binding = "DB"
# database_name = "mengyu-lab-messages"
# database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"